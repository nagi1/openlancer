; OpenLancer mission prefab, format 1. The game does not read this file.
[Prefab]
id = conversation
name = Conversation
kind = beat
help = A conversation of comm lines, and the trigger that starts it.
writes = A [Dialog] section with one line for each comm line, and a [Trigger] section with Act_StartDialog.
format = 1

[Field]
id = lines
label = Lines
kind = list
column = speaker, object, Speaker
column = listener, object, Listener
column = line, commLine, Comm line
per_instance = true
help = The comm lines of the conversation, in order.

[Field]
id = system
label = System
kind = system
per_instance = true
help = The system where the conversation plays. The game drops a conversation without a system.
default = none

[Field]
id = startsWhen
label = Starts when
kind = condition
help = The event that the start trigger waits for.
default = Cnd_True = no_params

[Dialog]
role = dialog
nickname = {instance}_dialog
system = {system}
line = {lines.speaker}, {lines.listener}, {lines.line}

[Trigger]
role = start
nickname = {instance}_start
{startsWhen} =
Act_StartDialog = {instance}_dialog
