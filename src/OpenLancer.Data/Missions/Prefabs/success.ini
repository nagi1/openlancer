; OpenLancer mission prefab, format 1. The game does not read this file.
[Prefab]
id = success
name = Mission success
kind = beat
help = The end of the mission with success: the reward, the reputation changes, the log text and the end scene.
writes = A [Trigger] section with Act_ChangeState = SUCCEED.
format = 1

[Field]
id = succeedsWhen
label = Succeeds when
kind = condition
help = The event that the success trigger waits for.
default = Cnd_True = no_params

[Field]
id = reward
label = Reward
kind = wholeNumber
unit = credits
optional = true
help = The money that the player gets. Without a value, the player gets no money.

[Field]
id = reputation
label = Reputation changes
kind = lines
key = Act_SetRep
help = The reputation changes of the success.

[Field]
id = log
label = Log text
kind = list
column = text, textId, Text
help = The log texts that the success adds.

[Field]
id = endScene
label = End scene
kind = baseScene
optional = true
help = The base scene that the success adds. Without a value, the success adds no scene.

[Trigger]
role = success
nickname = {instance}_success
{succeedsWhen} =
Act_AdjAcct = {reward}
{reputation} =
Act_NNIds = {log.text}
Act_AddRTC = {endScene}
Act_ChangeState = SUCCEED
