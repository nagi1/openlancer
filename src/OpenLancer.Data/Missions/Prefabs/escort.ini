; OpenLancer mission prefab, format 1. The game does not read this file.
[Prefab]
id = escort
name = Escort
kind = order
help = Orders that make a ship follow the player or another ship.
writes = An [ObjList] section with a Follow line.
format = 1

[Field]
id = follows
label = Follows
kind = object
per_instance = true
help = The ship that the escort follows.
default = Player

[Field]
id = distance
label = Distance
kind = wholeNumber
unit = m
help = The distance in meters that the escort keeps from the ship that it follows.
default = 300

[ObjList]
role = orders
nickname = {instance}_orders
Follow = {follows}, {distance}
