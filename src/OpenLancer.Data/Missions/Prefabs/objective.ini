; OpenLancer mission prefab, format 1. The game does not read this file.
[Prefab]
id = objective
name = Objective
kind = beat
help = A trigger that only sets the objective and its texts.
writes = A [Trigger] section with Act_SetNNObj, Act_SetTitle and Act_NNIds lines.
format = 1

[Field]
id = startsWhen
label = Starts when
kind = condition
help = The event that the trigger waits for.
default = Cnd_True = no_params

[Field]
id = objective
label = Objective
kind = objective
per_instance = true
help = The objective that the trigger sets.
default = none

[Field]
id = title
label = Title
kind = textId
optional = true
help = The mission title that the trigger sets. Without a value, the title does not change.

[Field]
id = log
label = Log text
kind = list
column = text, textId, Text
help = The log texts that the trigger adds.

[Trigger]
role = objective
nickname = {instance}_objective
{startsWhen} =
Act_SetNNObj = {objective}
Act_SetTitle = {title}
Act_NNIds = {log.text}
