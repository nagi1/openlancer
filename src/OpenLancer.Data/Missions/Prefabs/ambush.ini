; OpenLancer mission prefab, format 1. The game does not read this file.
[Prefab]
id = ambush
name = Ambush
kind = beat
help = Attackers that the mission spawns near a target, and the reaction when they come.
writes = A [MsnRandEnc] section, a [Trigger] section with Act_EnableEnc, and a [Trigger] section with Cnd_EncLaunched.
format = 1

[Field]
id = attackers
label = Attackers
kind = faction
per_instance = true
help = The faction of the attackers.
default = none

[Field]
id = target
label = Target
kind = object
help = The ship that the attackers attack.
default = Player

[Field]
id = shape
label = Formation shape
kind = formationShape
help = The formation of the attackers.
default = none

[Port]
id = onSpawn
label = On spawn
role = onSpawn

[MsnRandEnc]
role = encounter
nickname = {instance}_enc
encounter_type = SP_Attack
attacker_rep_name = {attackers}
target_ship_name = {target}
formation = {shape}, 1, 1, 1
num_forms = 1, 1

[Trigger]
role = armedBy
nickname = {instance}_arm
Cnd_True = no_params
Act_EnableEnc = {instance}_enc
Act_ActTrig = {instance}_spawned

[Trigger]
role = onSpawn
nickname = {instance}_spawned
Cnd_EncLaunched = {instance}_enc
Act_ActTrig = {port:onSpawn}
