; OpenLancer mission prefab, format 1. The game does not read this file.
[Prefab]
id = spawnWave
name = Spawn wave
kind = beat
help = A formation that spawns and gets orders and sides, and the trigger that waits until its ships are destroyed.
writes = A [Trigger] section with an Act_SpawnFormation line, and a [Trigger] section with Cnd_Destroyed.
format = 1

[Field]
id = ships
label = Ships
kind = formation
per_instance = true
help = The formation that the wave spawns.
default = none

[Field]
id = spawnWhen
label = Spawn when
kind = condition
help = The event that the spawn trigger waits for.
default = Cnd_True = no_params

[Field]
id = orders
label = Orders
kind = objList
optional = true
help = The order list that the trigger gives to the ships. Without a value, the ships keep the orders of their formation.

[Field]
id = sides
label = Sides
kind = lines
key = Act_SetVibe
key = Act_SetVibeLbl
key = Act_SetVibeLblToShip
key = Act_SetVibeShipToLbl
help = The attitude lines of the spawn trigger. They set which ships the new ships fight.

[Port]
id = done
label = When all are destroyed
role = end

[Trigger]
role = spawn
nickname = {instance}_spawn
{spawnWhen} =
Act_SpawnFormation = {ships}
Act_GiveObjList = {ships}, {orders}
{sides} =
Act_ActTrig = {instance}_end

[Trigger]
role = end
nickname = {instance}_end
Cnd_Destroyed = {ships}, -1
Act_ActTrig = {port:done}
