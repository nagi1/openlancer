; OpenLancer mission prefab, format 1. The game does not read this file.
[Prefab]
id = fail
name = Mission fail
kind = beat
help = The end of the mission with fail, and the text that tells the player why.
writes = A [Trigger] section with Act_ChangeState = FAIL and a text id.
format = 1

[Field]
id = failsWhen
label = Fails when
kind = condition
help = The event that the fail trigger waits for.
default = Cnd_True = no_params

[Field]
id = failText
label = Fail text
kind = textId
help = The text that tells the player why the mission failed.
default = 0

[Trigger]
role = fail
nickname = {instance}_fail
{failsWhen} =
Act_ChangeState = FAIL, {failText}
