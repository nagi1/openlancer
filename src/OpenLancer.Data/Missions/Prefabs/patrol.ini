; OpenLancer mission prefab, format 1. The game does not read this file.
[Prefab]
id = patrol
name = Patrol
kind = order
help = Orders that make a ship fly along two or more points.
writes = An [ObjList] section with a GotoVec line for each point.
format = 1

[Field]
id = waypoints
label = Waypoints
kind = list
column = point, position, Point
per_instance = true
help = The points that the ship flies to, in order.
default = 0, 0, 0
default = 1000, 0, 0

[ObjList]
role = orders
nickname = {instance}_orders
GotoVec = goto_cruise, {waypoints.point}, 100
