; OpenLancer mission prefab, format 1. The game does not read this file.
[Prefab]
id = lockGate
name = Lock or unlock gate
kind = beat
help = A trigger that only locks or unlocks docks and gates, for the player or for other ships.
writes = A [Trigger] section with Act_LockDock lines.
format = 1

[Field]
id = startsWhen
label = Starts when
kind = condition
help = The event that the trigger waits for.
default = Cnd_True = no_params

[Field]
id = docks
label = Docks
kind = lines
key = Act_LockDock
per_instance = true
help = The docks, gates and jump holes that the trigger locks or unlocks.
default = Act_LockDock = Player, none, lock

[Trigger]
role = lock
nickname = {instance}_lock
{startsWhen} =
{docks} =
