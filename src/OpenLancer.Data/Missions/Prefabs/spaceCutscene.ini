; OpenLancer mission prefab, format 1. The game does not read this file.
[Prefab]
id = spaceCutscene
name = Play space cutscene
kind = beat
help = A space cutscene: the trigger that starts it on an anchor ship, and the trigger that gives the camera back.
writes = A [Trigger] section with an Act_CallThorn line, and a [Trigger] section with an Act_RevertCam line.
format = 1

[Field]
id = file
label = Cutscene file
kind = spaceCutscene
per_instance = true
help = The space cutscene that the trigger plays.
default = none

[Field]
id = anchor
label = Anchor
kind = object
help = The ship that the camera of the cutscene moves with. Player makes the camera move with the player.
default = Player

[Field]
id = endsWhen
label = Ends when
kind = condition
help = The event that the trigger with "End camera" waits for.
default = Cnd_Timer = 10

[Port]
id = cameraBack
label = When the camera is back
role = revert

[Trigger]
role = play
nickname = {instance}_play
Cnd_True = no_params
Act_CallThorn = {file}, {anchor}
Act_ActTrig = {instance}_revert

[Trigger]
role = revert
nickname = {instance}_revert
{endsWhen} =
Act_RevertCam = no_params
Act_ActTrig = {port:cameraBack}
