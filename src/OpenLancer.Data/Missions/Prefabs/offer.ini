; OpenLancer mission prefab, format 1. The game does not read this file.
[Prefab]
id = offer
name = Offer mission
kind = beat
help = A mission offer in a bar: the offer scene, and what happens when the player accepts or declines.
writes = A [Trigger] section with Act_AddRTC lines, and two [Trigger] sections with Cnd_MsnResponse.
format = 1

[Field]
id = offerScene
label = Offer scene
kind = list
column = file, baseScene, Scene file
per_instance = true
help = The base scenes that show the offer to the player.

[Port]
id = onAccept
label = On accept
role = accept

[Port]
id = onDecline
label = On decline
role = decline

[Trigger]
role = accept
nickname = {instance}_accept
Cnd_MsnResponse = accept
Act_ActTrig = {port:onAccept}

[Trigger]
role = decline
nickname = {instance}_decline
Cnd_MsnResponse = reject
Act_ActTrig = {port:onDecline}

[Trigger]
role = scene
nickname = {instance}_scene
Cnd_True = no_params
Act_AddRTC = {offerScene.file}
Act_ActTrig = {instance}_accept
Act_ActTrig = {instance}_decline
