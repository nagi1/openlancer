; OpenLancer mission prefab, format 1. The game does not read this file.
[Prefab]
id = checkpoint
name = Checkpoint
kind = beat
help = A save point, and the trigger where the mission continues after a load.
writes = A [Trigger] section with an Act_Save line, and the [Trigger] section that the line names.
format = 1

[Field]
id = savesWhen
label = Saves when
kind = condition
help = The event that the save trigger waits for. The game saves the mission when this trigger runs.
default = Cnd_True = no_params

[Field]
id = restoreWaitsFor
label = Restore waits for
kind = condition
help = The event that the restore trigger waits for after a load.
default = Cnd_True = no_params

[Port]
id = restored
label = After a load
role = restore

[Trigger]
role = save
nickname = {instance}_save
{savesWhen} =
Act_Save = {instance}_restore

[Trigger]
role = restore
nickname = {instance}_restore
{restoreWaitsFor} =
Act_ActTrig = {port:restored}
