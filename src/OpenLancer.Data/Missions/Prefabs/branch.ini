; OpenLancer mission prefab, format 1. The game does not read this file.
[Prefab]
id = branch
name = Branch
kind = beat
help = An if and an else on the state of a trigger. One watcher runs when the trigger is active. The other runs when it is not active.
writes = Two [Trigger] sections with Cnd_WatchTrigger, ON and OFF. Each watcher stops the other one.
format = 1

[Field]
id = tests
label = Tests trigger
kind = trigger
per_instance = true
help = The trigger whose state the watchers test.
default = none

[Port]
id = ifActive
label = If it is active
role = on

[Port]
id = ifNotActive
label = If it is not active
role = off

[Trigger]
role = on
nickname = {instance}_on
Cnd_WatchTrigger = {tests}, ON
Act_DeactTrig = {instance}_off
Act_ActTrig = {port:ifActive}

[Trigger]
role = off
nickname = {instance}_off
Cnd_WatchTrigger = {tests}, OFF
Act_DeactTrig = {instance}_on
Act_ActTrig = {port:ifNotActive}
