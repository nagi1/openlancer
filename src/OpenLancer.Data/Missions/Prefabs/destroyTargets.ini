; OpenLancer mission prefab, format 1. The game does not read this file.
[Prefab]
id = destroyTargets
name = Destroy targets
kind = beat
help = Ships that the player must destroy. Marks show them on the screen. A trigger waits until they are destroyed.
writes = A [Trigger] section with an Act_MarkObj line, and a [Trigger] section with Cnd_Destroyed.
format = 1

[Field]
id = targets
label = Targets
kind = object
per_instance = true
help = The ship, the formation or the label of the ships that the player must destroy.
default = none

[Port]
id = done
label = When all are destroyed
role = done

[Trigger]
role = mark
nickname = {instance}_mark
Cnd_True = no_params
Act_MarkObj = {targets}, 1
Act_ActTrig = {instance}_done

[Trigger]
role = done
nickname = {instance}_done
Cnd_Destroyed = {targets}, -1
Act_ActTrig = {port:done}
