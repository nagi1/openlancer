# Builds OpenLancer and runs its checks for each push to master and each pull request.
# CI has no game data, so the retail tests skip. CONTRIBUTING.md tells contributors to run them on their machine.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build-test:
    name: build-test
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out OpenLancer
        uses: actions/checkout@v7

      - name: Get the engine fork and its submodules
        run: |
          git submodule sync --recursive
          if ! git submodule update --init --depth 1 external/Librelancer; then
            # The pointer of a pull request can name a fork commit that is only in a pull request of the fork.
            git -C external/Librelancer fetch --depth 1 origin '+refs/pull/*/head:refs/remotes/origin/pr/*'
            git submodule update --init external/Librelancer
          fi
          git -C external/Librelancer submodule update --init --recursive --depth 1
          echo "FORK_SHA=$(git -C external/Librelancer rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The scan runs before the build, so that a legal problem stops the run in seconds.
      - name: Content scan
        run: |
          python -B -m unittest discover -s tools
          python tools/content_scan.py
          python tools/content_scan.py --fork

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache the NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # The natives and the shader tools change only with the fork commit.
      - name: Restore the engine natives and shader tools
        id: natives
        uses: actions/cache/restore@v6
        with:
          path: |
            external/Librelancer/bin/natives
            external/Librelancer/bin/builddeps
            external/Librelancer/src/LLShaderCompiler/bin
            external/Librelancer/src/CommonVersion.props
          key: natives-v1-${{ runner.os }}-${{ env.FORK_SHA }}

      # docs/UPSTREAM.md asks for CMake 4.2 or later, because the build selects the newest Visual Studio.
      - name: Install CMake
        if: steps.natives.outputs.cache-hit != 'true'
        run: |
          python -m pip install --disable-pip-version-check "cmake>=4.2,<5"
          cmake --version

      - name: Build the engine natives and shader tools
        if: steps.natives.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: external/Librelancer
        run: ./build.ps1 --assemblyversion 0.0.0-ol GenerateVersion BuildNatives ShaderDependencies

      # Save right after the build, so that a later test failure does not lose the natives.
      - name: Save the engine natives and shader tools
        if: steps.natives.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            external/Librelancer/bin/natives
            external/Librelancer/bin/builddeps
            external/Librelancer/src/LLShaderCompiler/bin
            external/Librelancer/src/CommonVersion.props
          key: natives-v1-${{ runner.os }}-${{ env.FORK_SHA }}

      - name: Build OpenLancer
        run: dotnet build OpenLancer.slnx --configuration Debug

      - name: Unit tests
        run: dotnet test tests/OpenLancer.Tests --configuration Debug --no-build

      - name: Data tests (the retail tests skip)
        run: dotnet test tests/OpenLancer.DataTests --configuration Debug --no-build

      - name: Engine fork tests (the retail tests skip)
        run: dotnet test external/Librelancer/src/LibreLancer.Tests/LibreLancer.Tests.csproj --configuration Debug
